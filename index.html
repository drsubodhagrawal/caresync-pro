<title>CareSync Pro — Worldwide Healthcare Platform</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F6FA;--card:#FFF;--card2:#F8F9FC;

  --red:#C0392B;--redL:#FDECEA;--green:#1A7A50;--greenL:#E5F5ED;

body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:420px;background:var(--card);border-radius:16px;border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden}

.login-title{font-size:22px;font-weight:800}
.login-sub{font-size:13px;color:var(--txM);margin-top:4px}

.pw-wrap{position:relative;margin-bottom:8px}
.pw-wrap input{padding-right:48px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:var(--txM);padding:0}
.stay-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;transition:all .15s}
.check-box.on{border-color:var(--pri);background:var(--pri)}

.btn-primary:hover{opacity:.9}
.btn-accent{background:var(--accG)}
.btn-gold{background:var(--goldG)}
.error-box{padding:10px 14px;border-radius:8px;background:var(--redL);color:var(--red);font-size:13px;font-weight:600;margin-bottom:14px}
.links-row{display:flex;justify-content:center;gap:16px;margin-top:14px}

.section-dim{margin-top:24px}

.rb-card{background:var(--card);border-radius:14px;border:1px solid var(--bd);box-shadow:var(--sh);padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .15s;margin-bottom:10px}

.tier-badge{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:800;font-family:var(--fm)}

.module-row{border-radius:12px;border:1.5px solid var(--bdL);background:var(--card);overflow:hidden;margin-bottom:8px}
.module-row.on{border-color:rgba(11,110,153,.3);background:rgba(11,110,153,.03)}
.module-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.module-perms{padding:8px 16px 12px 52px;border-top:1px solid var(--bdL);display:flex;flex-wrap:wrap;gap:6px}
.perm-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--bdL);background:var(--card);color:var(--txM);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--fm);transition:all .1s}
.perm-btn.on{border-color:var(--pri);background:var(--priL);color:var(--pri)}
.mfa-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:24px}
.mfa-toggle.on{background:var(--accL);border:1px solid rgba(26,122,80,.3)}
.mfa-toggle.off{background:var(--card2);border:1px solid var(--bdL)}
.btn-row{display:flex;gap:10px}
.btn-save{padding:12px 28px;border-radius:10px;border:none;background:var(--accG);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fn)}
.btn-cancel{padding:12px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--txS);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fn)}
.btn-delete{padding:12px 20px;border-radius:10px;border:1px solid rgba(192,57,43,.3);background:var(--redL);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fn);margin-left:auto}
.hint-box{margin-top:24px;padding:18px 20px;border-radius:14px;background:var(--priL);border:1px solid rgba(11,110,153,.15)}
.hint-title{font-size:13px;font-weight:700;color:var(--pri);margin-bottom:6px}
.hint-text{font-size:12px;color:var(--txS);line-height:1.7}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;background:var(--tx);color:#fff;font-size:14px;font-weight:700;font-family:var(--fn);box-shadow:var(--shM);z-index:9999;animation:fadeUp .2s}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.chrome-hint{padding:10px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--bdL);display:flex;align-items:center;gap:10px;margin-top:14px}
.chrome-hint span{font-size:20px}
.chrome-hint div{font-size:12px;color:var(--txS);line-height:1.5}
</style>
</head>

  const Login=()=>(<div className="login-wrap"><div className="login-card"><div className="login-header"><div className="logo-mark">CS</div><div className="login-title">CareSync Pro</div><div className="login-sub">Worldwide healthcare platform</div></div><div className="login-body"><div className="demo-label">DEMO — TAP TO LOGIN AS:</div><div className="demo-chips">{Object.entries(DEMO_USERS).map(([em,u])=>(<button key={em} className={`demo-chip${email===em?" active":""}`} onClick={()=>{setEmail(em);setPw("Demo@2026!");setError("")}}>{u.avatar} {u.name.split(" ").slice(-1)[0]}</button>))}</div><label className="form-label">Email</label><input className="form-input" style={{marginBottom:14}} type="email" value={email} onChange={e=>{setEmail(e.target.value);setError("")}} placeholder="you@clinic.com" autoComplete="username"/><label className="form-label">Password</label><div className="pw-wrap"><input className="form-input" type={showPw?"text":"password"} value={pw} onChange={e=>{setPw(e.target.value);setError("")}} placeholder="Your password" autoComplete="current-password"/><button className="pw-toggle" onClick={()=>setShowPw(!showPw)}>{showPw?"\u{1F648}":"\u{1F441}\uFE0F"}</button></div><div className="stay-row" onClick={()=>setStayLogged(!stayLogged)}><div className={`check-box${stayLogged?" on":""}`}>{stayLogged?"\u2713":""}</div><span style={{fontSize:13,color:"var(--txS)"}}>Keep me signed in</span></div>{error&&<div className="error-box">{error}</div>}<button className="btn-primary" onClick={()=>{const u=DEMO_USERS[email];if(!u){setError("Account not found.");return}if(!pw){setError("Please enter your password.");return}const r=roles.find(rl=>rl.id===u.role);if(r?.mfaRequired){setUser({...u,email});setView("mfa")}else{setUser({...u,email});setView("dashboard");flash("Welcome, "+u.name.split(" ")[0]+"!")}}}>Sign in</button><div className="links-row"><button className="link-btn" onClick={()=>{setRecEmail(email);setView("recover")}}>Forgot password?</button><span style={{color:"var(--bdL)"}}>\u00B7</span><button className="link-btn" onClick={()=>flash("Patient registration \u2192")}>New patient? Register</button></div></div><div className="login-footer">\u{1F512} HIPAA \u00B7 TLS 1.3 \u00B7 ONC Certified</div></div></div>);

  const Mfa=()=>{const r=getRole(user);const m=r?.mfaMethod||"totp";return(<div className="login-wrap"><div className="login-card" style={{padding:32}}><div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:40,marginBottom:8}}>{m==="fido2"?"\u{1F510}":"\u{1F4F1}"}</div><div style={{fontSize:20,fontWeight:800}}>Verify your identity</div><div style={{fontSize:13,color:"var(--txS)",marginTop:4}}>{m==="fido2"?"Touch your security key":"Enter the 6-digit code from your authenticator"}</div></div>{m==="fido2"?<button className="btn-primary btn-gold" onClick={()=>{setView("dashboard");flash("Welcome, "+user.name.split(" ")[0]+"!")}}>\u{1F511} Tap security key</button>:<><input className="form-input mfa-input" value={mfaCode} onChange={e=>setMfaCode(e.target.value.replace(/\D/g,""))} maxLength={6} placeholder="000000" style={{marginBottom:14}}/><button className="btn-primary" onClick={()=>{if(mfaCode.length<6){setError("Enter all 6 digits");return}setView("dashboard");setMfaCode("");setError("");flash("Welcome, "+user.name.split(" ")[0]+"!")}}>Verify</button></>}{error&&<div className="error-box" style={{marginTop:14,textAlign:"center"}}>{error}</div>}<div style={{textAlign:"center",marginTop:14}}><button className="link-btn" onClick={()=>{setView("login");setMfaCode("");setError("")}}>\u2190 Back to login</button></div></div></div>)};

  const Recover=()=>(<div className="login-wrap"><div className="login-card" style={{padding:32}}><div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:40,marginBottom:8}}>\u{1F511}</div><div style={{fontSize:20,fontWeight:800}}>Reset your password</div><div style={{fontSize:13,color:"var(--txS)",marginTop:4}}>Choose how to verify your identity</div></div><label className="form-label">Email address</label><input className="form-input" value={recEmail} onChange={e=>setRecEmail(e.target.value)} style={{marginBottom:16}} placeholder="you@clinic.com"/><label className="form-label">Verification method</label><div className="method-grid">{[{id:"email",label:"Email code",icon:"\u{1F4E7}",sub:"6-digit code"},{id:"sms",label:"SMS code",icon:"\u{1F4F1}",sub:"Text message"},{id:"voice",label:"Voice call",icon:"\u{1F4DE}",sub:"Landline OK"}].map(m=>(<div key={m.id} className={`method-card${recMethod===m.id?" active":""}`} onClick={()=>setRecMethod(m.id)}><div className="method-icon">{m.icon}</div><div className="method-label" style={{color:recMethod===m.id?"var(--pri)":"var(--tx)"}}>{m.label}</div><div className="method-sub">{m.sub}</div></div>))}</div><button className="btn-primary" onClick={()=>{setView("recover_verify");flash("Verification code sent!")}}>Send verification code</button><div style={{textAlign:"center",marginTop:14}}><button className="link-btn" onClick={()=>setView("login")}>\u2190 Back to login</button></div></div></div>);

  const RecoverVerify=()=>(<div className="login-wrap"><div className="login-card" style={{padding:32}}><div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:40,marginBottom:8}}>{recMethod==="email"?"\u{1F4E7}":recMethod==="sms"?"\u{1F4F1}":"\u{1F4DE}"}</div><div style={{fontSize:20,fontWeight:800}}>Enter verification code</div><div style={{fontSize:13,color:"var(--txS)",marginTop:4}}>{recMethod==="voice"?"Listen for your code on the call":"Check your "+(recMethod==="email"?"inbox":"phone")}</div><div style={{fontSize:12,fontFamily:"var(--fm)",color:"var(--pri)",marginTop:8,background:"var(--priL)",padding:"6px 14px",borderRadius:8,display:"inline-block"}}>{recEmail}</div></div><input className="form-input mfa-input" value={recCode} onChange={e=>setRecCode(e.target.value.replace(/\D/g,""))} maxLength={6} placeholder="000000" style={{marginBottom:16}}/><button className="btn-primary" style={{opacity:recCode.length===6?1:.5}} onClick={()=>setView("recover_new")}>Verify code</button><div className="links-row"><button className="link-btn" onClick={()=>flash("New code sent!")}>Resend code</button><span style={{color:"var(--bdL)"}}>\u00B7</span><button className="link-btn" onClick={()=>setView("recover")}>\u2190 Different method</button></div></div></div>);

  const RecoverNew=()=>{const s=pwStr(newPw);const match=newPw&&confirmPw&&newPw===confirmPw;const mis=confirmPw&&newPw!==confirmPw;return(<div className="login-wrap"><div className="login-card" style={{padding:32}}><div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:40,marginBottom:8}}>\u{1F510}</div><div style={{fontSize:20,fontWeight:800}}>Create new password</div><div style={{fontSize:13,color:"var(--txS)",marginTop:4}}>Chrome will remember it for you</div></div><label className="form-label">New password</label><div className="pw-wrap" style={{marginBottom:8}}><input className="form-input" type={showNewPw?"text":"password"} value={newPw} onChange={e=>setNewPw(e.target.value)} style={{fontSize:18}} placeholder="Min 14 characters" autoComplete="new-password"/><button className="pw-toggle" onClick={()=>setShowNewPw(!showNewPw)}>{showNewPw?"\u{1F648}":"\u{1F441}\uFE0F"}</button></div>{newPw&&<div style={{marginBottom:14}}><div className="str-bar">{[0,1,2,3,4].map(i=><div key={i} className="str-seg" style={{background:i<s?pwC[s-1]:"var(--bdL)"}}/>)}</div><div className="str-meta"><span className="str-label" style={{color:pwC[s-1]||"var(--txM)"}}>{pwL[s-1]||"Too short"}</span><div className="str-rules">{[[/[A-Z]/,"A-Z"],[/[a-z]/,"a-z"],[/[0-9]/,"0-9"],[/[^A-Za-z0-9]/,"!@#"],[newPw.length>=14,"14+"]].map(([t,l],i)=>{const p=typeof t==="boolean"?t:t.test(newPw);return <span key={i} className={`str-rule ${p?"pass":"fail"}`}>{p?"\u2713":"\u25CB"}{l}</span>})}</div></div></div>}<label className="form-label">Confirm password</label><input className="form-input" type={showNewPw?"text":"password"} value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} style={{marginBottom:8,borderColor:mis?"var(--red)":match?"var(--green)":"var(--bd)"}} placeholder="Re-enter" autoComplete="new-password"/>{mis&&<div style={{fontSize:13,color:"var(--red)",fontWeight:700,marginBottom:10}}>\u2717 Passwords don't match</div>}{match&&<div style={{fontSize:13,color:"var(--green)",fontWeight:700,marginBottom:10}}>\u2713 Passwords match!</div>}<button className="btn-primary btn-accent" style={{opacity:match&&s>=3?1:.4}} onClick={()=>{setView("recover_done");flash("Password reset!")}}>Reset password</button><div className="chrome-hint"><span>\u{1F4A1}</span><div>Chrome will ask to save this password. <strong>Say yes!</strong> Next time it autofills.</div></div></div></div>)};

  const RecoverDone=()=>(<div className="login-wrap"><div className="login-card" style={{padding:"40px 32px",textAlign:"center"}}><div style={{fontSize:56,marginBottom:12}}>\u2705</div><div style={{fontSize:22,fontWeight:800,marginBottom:8}}>Password reset!</div><div style={{fontSize:14,color:"var(--txS)",marginBottom:24}}>Sign in with your new password. Chrome has saved it.</div><button className="btn-primary" onClick={()=>{setView("login");setNewPw("");setConfirmPw("");setRecCode("")}}>Sign in now</button></div></div>);

  const Dashboard=()=>{const role=getRole(user);const myMods=getMods(user);return(<div className="dash"><div className="topbar"><div className="topbar-logo"><div className="topbar-mark">CS</div><div><div style={{fontSize:15,fontWeight:800}}>CareSync Pro</div><div style={{fontSize:10,color:"var(--txM)",fontFamily:"var(--fm)"}}>{user?.region} \u00B7 {role?.name}</div></div></div><div className="topbar-right">{role?.tier<=2&&<button className="btn-sm btn-role-builder" onClick={()=>setView("role_builder")}>\u2699\uFE0F Role Builder</button>}<div className="user-pill"><div className="user-av" style={{background:(role?.color||"#0B6E99")+"20",color:role?.color||"#0B6E99"}}>{user?.avatar}</div><div><div style={{fontSize:13,fontWeight:700}}>{user?.name}</div><div style={{fontSize:10,color:"var(--txM)",fontFamily:"var(--fm)"}}>{user?.email}</div></div></div><button className="btn-sm btn-signout" onClick={()=>{setView("login");setUser(null);setPw("");setError("")}}>Sign out</button></div></div><div className="dash-content"><div className="welcome"><h1>Welcome, {user?.name?.split(" ")[0]} \u{1F44B}</h1><p>Your role: <span style={{fontWeight:700,color:role?.color}}>{role?.icon} {role?.name}</span> \u2014 {myMods.length} module{myMods.length!==1?"s":""} available</p></div><div className="tile-grid">{myMods.map(m=>{const perms=role?.permissions?.[m.id]||[];return(<div key={m.id} className="module-tile" onClick={()=>{if(m.link){window.location.href=m.link}else{setSelectedMod(selectedMod===m.id?null:m.id)}}} style={{borderColor:selectedMod===m.id?m.color:"var(--bd)"}}><div className="tile-head"><span className="tile-icon">{m.icon}</span><div><div className="tile-name">{m.name}</div><div className="tile-desc">{m.desc}</div></div></div>{m.link&&<div style={{fontSize:10,color:m.color,fontWeight:700,fontFamily:"var(--fm)",marginTop:4}}>\u2192 OPEN MODULE</div>}{selectedMod===m.id&&<div className="tile-perms">{perms.map(p=><span key={p} className="perm-badge" style={{background:p==="admin"?"var(--goldL)":p==="sign"?"var(--accL)":p==="delete"?"var(--redL)":"var(--priL)",color:p==="admin"?"var(--gold)":p==="sign"?"var(--acc)":p==="delete"?"var(--red)":"var(--pri)"}}>{p}</span>)}</div>}</div>)})}</div>{ALL_MODULES.filter(m=>!role?.modules?.includes(m.id)).length>0&&(<div className="section-dim"><div className="section-label">NOT AVAILABLE FOR YOUR ROLE</div><div className="tile-grid">{ALL_MODULES.filter(m=>!role?.modules?.includes(m.id)).map(m=>(<div key={m.id} className="module-tile dim"><div className="tile-head"><span className="tile-icon">{m.icon}</span><div><div className="tile-name">{m.name}</div><div className="tile-desc">No access</div></div></div></div>))}</div></div>)}</div></div>)};

  const RoleBuilder=()=>{const startNew=()=>{setEditingRole("new");setNrName("");setNrDesc("");setNrTier(5);setNrMods([]);setNrPerms({});setNrMfa(false);setNrSession(15)};const startEdit=(r)=>{setEditingRole(r.id);setNrName(r.name);setNrDesc(r.description);setNrTier(r.tier);setNrMods([...r.modules]);setNrPerms(JSON.parse(JSON.stringify(r.permissions)));setNrMfa(r.mfaRequired);setNrSession(r.sessionMin)};const togMod=(mid)=>{if(nrMods.includes(mid)){setNrMods(nrMods.filter(m=>m!==mid));const p={...nrPerms};delete p[mid];setNrPerms(p)}else{setNrMods([...nrMods,mid]);setNrPerms({...nrPerms,[mid]:["view"]})}};const togPerm=(mid,a)=>{const c=nrPerms[mid]||[];if(c.includes(a))setNrPerms({...nrPerms,[mid]:c.filter(x=>x!==a)});else setNrPerms({...nrPerms,[mid]:[...c,a]})};const save=()=>{const obj={id:editingRole==="new"?nrName.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,""):editingRole,name:nrName,description:nrDesc,tier:nrTier,color:"#0B6E99",icon:"\u{1F527}",builtIn:false,modules:nrMods,permissions:nrPerms,mfaRequired:nrMfa,mfaMethod:nrMfa?"totp":"optional",sessionMin:nrSession};if(editingRole==="new")setRoles([...roles,obj]);else setRoles(roles.map(r=>r.id===editingRole?{...r,...obj,id:r.id,builtIn:r.builtIn}:r));setEditingRole(null);flash(editingRole==="new"?'Role "'+nrName+'" created!':'Role "'+nrName+'" updated!')};return(<div className="dash"><div className="topbar"><div style={{display:"flex",alignItems:"center",gap:10}}><button className="btn-sm btn-signout" onClick={()=>setView("dashboard")}>\u2190 Dashboard</button><div style={{fontSize:16,fontWeight:800}}>\u2699\uFE0F Dynamic Role & Permission Builder</div></div><button className="btn-sm" style={{border:"none",background:"var(--accG)",color:"#fff"}} onClick={startNew}>+ Create new role</button></div><div style={{padding:28,maxWidth:1100,margin:"0 auto"}}>{!editingRole&&<><div className="section-label">{roles.length} ROLES DEFINED \u2014 TAP TO EDIT</div>{roles.map(r=>(<div key={r.id} className="rb-card" onClick={()=>startEdit(r)}><div className="rb-icon" style={{background:(r.color||"#0B6E99")+"18"}}>{r.icon}</div><div className="rb-info"><div className="rb-name">{r.name} <span className="tier-badge" style={{background:(r.color||"#0B6E99")+"15",color:r.color||"#0B6E99"}}>TIER {r.tier}</span>{r.builtIn&&<span className="builtin-badge">BUILT-IN</span>}</div><div className="rb-desc">{r.description}</div></div><div className="rb-meta"><div style={{fontSize:12,fontWeight:700,color:"var(--pri)"}}>{r.modules.length} modules</div><div style={{fontSize:11,color:"var(--txM)",fontFamily:"var(--fm)"}}>{r.mfaRequired?"MFA required":"MFA optional"}</div></div><div style={{fontSize:16,color:"var(--txM)"}}>\u2192</div></div>))}<div className="hint-box"><div className="hint-title">\u{1F4A1} How dynamic roles work</div><div className="hint-text">When new tech is added (Genomics, AI Scribe, etc.), add it as a module, then edit roles to grant access \u2014 or create a new role. Roles are database-driven, not hardcoded. The 8-action permission matrix covers any future module without code changes.</div></div></>}{editingRole&&<div className="editor"><div style={{fontSize:18,fontWeight:800,marginBottom:20}}>{editingRole==="new"?"Create new role":"Edit: "+nrName}</div><div className="edit-grid grid-3"><div><label className="form-label">Role name</label><input className="form-input" value={nrName} onChange={e=>setNrName(e.target.value)} placeholder="e.g. Lab Technician"/></div><div><label className="form-label">Tier (0=highest)</label><input className="form-input" type="number" min={0} max={9} value={nrTier} onChange={e=>setNrTier(parseInt(e.target.value)||0)}/></div><div><label className="form-label">Session timeout (min)</label><input className="form-input" type="number" min={5} max={480} value={nrSession} onChange={e=>setNrSession(parseInt(e.target.value)||15)}/></div></div><div style={{marginBottom:20}}><label className="form-label">Description</label><input className="form-input" value={nrDesc} onChange={e=>setNrDesc(e.target.value)} placeholder="What this role does..."/></div><div className={`mfa-toggle ${nrMfa?"on":"off"}`} onClick={()=>setNrMfa(!nrMfa)}><div className={`check-box${nrMfa?" on":""}`} style={{width:20,height:20,borderRadius:6}}>{nrMfa?"\u2713":""}</div><div><div style={{fontSize:14,fontWeight:700}}>Require MFA</div><div style={{fontSize:12,color:"var(--txS)"}}>Recommended for Tier 0-4</div></div></div><div className="section-label">SELECT MODULES & ASSIGN PERMISSIONS</div>{ALL_MODULES.map(m=>{const isOn=nrMods.includes(m.id);const perms=nrPerms[m.id]||[];return(<div key={m.id} className={`module-row${isOn?" on":""}`}><div className="module-header" onClick={()=>togMod(m.id)}><div className={`check-box${isOn?" on":""}`} style={{width:20,height:20,borderRadius:6}}>{isOn?"\u2713":""}</div><span style={{fontSize:20}}>{m.icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{m.name}</div><div style={{fontSize:11,color:"var(--txM)"}}>{m.desc}</div></div></div>{isOn&&<div className="module-perms">{PERM_ACTIONS.map(a=><button key={a} className={`perm-btn${perms.includes(a)?" on":""}`} onClick={()=>togPerm(m.id,a)}>{perms.includes(a)?"\u2713 ":""}{a}</button>)}</div>}</div>)})}<div className="btn-row" style={{marginTop:20}}><button className="btn-save" onClick={save}>{editingRole==="new"?"Create role":"Save changes"}</button><button className="btn-cancel" onClick={()=>setEditingRole(null)}>Cancel</button>{editingRole!=="new"&&!roles.find(r=>r.id===editingRole)?.builtIn&&<button className="btn-delete" onClick={()=>{setRoles(roles.filter(r=>r.id!==editingRole));setEditingRole(null);flash("Role deleted")}}>Delete role</button>}</div></div>}</div></div>)};

  const views={login:Login,mfa:Mfa,recover:Recover,recover_verify:RecoverVerify,recover_new:RecoverNew,recover_done:RecoverDone,dashboard:Dashboard,role_builder:RoleBuilder};
  const V=views[view]||Login;
  return(<>{V()}{toast&&<div className="toast">{toast}</div>}</>);
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
