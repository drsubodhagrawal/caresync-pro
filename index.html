<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CareSync Pro - Worldwide Healthcare Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F6FA;--card:#FFF;--card2:#F8F9FC;
  --pri:#0B6E99;--priL:#E5F3FA;
  --acc:#1A7A50;--accL:#E5F5ED;
  --gold:#9A6B10;--goldL:#FFF8E1;
  --sec:#8A3B5E;--red:#C0392B;--redL:#FDECEA;
  --green:#1A7A50;--greenL:#E5F5ED;
  --tx:#111827;--txS:#4B5563;--txM:#9CA3AF;
  --bd:#E5E7EB;--bdL:#F3F4F6;
  --fn:'DM Sans',system-ui,sans-serif;
  --fm:'JetBrains Mono',monospace;
  --sh:0 1px 6px rgba(0,0,0,.05);
  --shM:0 4px 16px rgba(0,0,0,.08)
}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}

/* === LOGIN === */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:440px;background:var(--card);border-radius:18px;border:1px solid var(--bd);box-shadow:var(--shM);overflow:hidden}
.login-header{padding:32px 32px 18px;text-align:center}
.logo-mark{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0B6E99,#1295CE);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:22px;font-weight:900;font-family:var(--fm)}
.login-title{font-size:24px;font-weight:900;color:var(--tx)}
.login-sub{font-size:13px;color:var(--txM);margin-top:4px}
.login-body{padding:0 32px 28px}
.demo-section{background:var(--card2);border:1px solid var(--bdL);border-radius:12px;padding:14px;margin-bottom:18px}
.demo-label{font-size:10px;font-weight:800;color:var(--txM);font-family:var(--fm);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.demo-chips{display:flex;flex-wrap:wrap;gap:5px}
.demo-chip{padding:5px 10px;border-radius:8px;border:1.5px solid var(--bdL);background:#fff;color:var(--txS);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all .15s}
.demo-chip.active{border-color:var(--pri);background:var(--priL);color:var(--pri);font-weight:700}
.demo-chip:hover{border-color:var(--pri)}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--txS);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.form-input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--bd);font-size:14px;font-family:var(--fn);color:var(--tx);outline:none;background:#fff;transition:border-color .15s}
.form-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,110,153,.1)}
.pw-wrap{position:relative;margin-bottom:10px}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:var(--txM);padding:4px}
.stay-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.cbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900;transition:all .15s;flex-shrink:0}
.cbox.on{border-color:var(--pri);background:var(--pri)}
.btn-primary{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0B6E99,#1295CE);font-family:var(--fn);transition:all .15s;box-shadow:0 4px 12px rgba(11,110,153,.25)}
.btn-primary:hover{opacity:.92;box-shadow:0 6px 16px rgba(11,110,153,.3)}
.btn-gold{background:linear-gradient(135deg,#9A6B10,#D4941A);box-shadow:0 4px 12px rgba(154,107,16,.25)}
.error-box{padding:10px 14px;border-radius:8px;background:var(--redL);color:var(--red);font-size:13px;font-weight:600;margin-bottom:14px;border:1px solid rgba(192,57,43,.2)}
.login-footer{padding:10px 32px;background:var(--card2);border-top:1px solid var(--bdL);text-align:center;font-size:11px;color:var(--green);font-weight:700;letter-spacing:.03em}
.links-row{display:flex;justify-content:center;gap:16px;margin-top:12px}
.link-btn{font-size:12px;color:var(--pri);cursor:pointer;font-weight:600;background:none;border:none;font-family:var(--fn);padding:0}
.link-btn:hover{text-decoration:underline}
.mfa-input{text-align:center;font-size:28px;font-weight:800;letter-spacing:12px;font-family:var(--fm)}

/* === DASHBOARD === */
.dash{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1.5px solid var(--bd);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0B6E99,#1295CE);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;font-family:var(--fm)}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fn);transition:all .15s;white-space:nowrap}
.btn-rb{border:1.5px solid rgba(154,107,16,.3);background:var(--goldL);color:var(--gold)}
.btn-rb:hover{background:#FFEFB3}
.btn-so{border:1.5px solid var(--bd);background:var(--card2);color:var(--txS)}
.btn-so:hover{background:#eee}
.user-pill{display:flex;align-items:center;gap:8px}
.user-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;font-family:var(--fm)}
.dash-body{flex:1;overflow-y:auto;padding:28px 24px}
.dash-inner{max-width:960px;margin:0 auto}
.welcome{margin-bottom:24px}
.welcome h1{font-size:22px;font-weight:900}
.welcome p{font-size:14px;color:var(--txS);margin-top:4px;line-height:1.5}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border-radius:14px;border:1.5px solid var(--bd);box-shadow:var(--sh);padding:20px 18px;cursor:pointer;transition:all .18s;position:relative}
.tile:hover{border-color:var(--pri);box-shadow:var(--shM);transform:translateY(-2px)}
.tile.dim{opacity:.3;cursor:not-allowed;pointer-events:none}
.tile-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tile-icon{font-size:28px;line-height:1}
.tile-name{font-size:14px;font-weight:800}
.tile-desc{font-size:11px;color:var(--txM)}
.tile-link{font-size:10px;font-weight:700;font-family:var(--fm);margin-top:6px;display:flex;align-items:center;gap:4px}
.tile-perms{border-top:1px solid var(--bdL);padding-top:8px;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.pbadge{padding:3px 7px;border-radius:5px;font-size:9px;font-weight:800;font-family:var(--fm);text-transform:uppercase;letter-spacing:.03em}
.section-label{font-size:11px;font-weight:800;color:var(--txM);font-family:var(--fm);letter-spacing:.08em;margin:28px 0 12px;text-transform:uppercase}

/* === ROLE BUILDER === */
.rb-card{background:var(--card);border-radius:14px;border:1.5px solid var(--bd);box-shadow:var(--sh);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.rb-card:hover{border-color:var(--pri);transform:translateX(3px)}
.rb-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rb-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tier-badge{padding:2px 7px;border-radius:5px;font-size:9px;font-weight:900;font-family:var(--fm);letter-spacing:.03em}
.builtin-tag{padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;font-family:var(--fm);background:var(--card2);color:var(--txM)}
.rb-desc{font-size:11px;color:var(--txS);margin-top:2px}
.rb-meta{text-align:right;min-width:90px;flex-shrink:0}
.hint-box{margin-top:28px;padding:18px 20px;border-radius:14px;background:var(--priL);border:1px solid rgba(11,110,153,.15)}

/* === TOAST === */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:12px;background:var(--tx);color:#fff;font-size:14px;font-weight:700;box-shadow:var(--shM);z-index:9999;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
// ===== DATA =====
var ALL_MODULES = [
  {id:"ehr",name:"Clinical EHR",icon:"\u{1FA7A}",desc:"Charts, orders, notes",color:"#0B6E99",link:"CareSync_Physician_Dashboard.html"},
  {id:"scheduler",name:"Scheduler",icon:"\u{1F4C5}",desc:"Appointments, calendar",color:"#0E7C86"},
  {id:"rcm",name:"Billing / RCM",icon:"\u{1F4B0}",desc:"Claims, payments, AR",color:"#5A3D8A"},
  {id:"portal",name:"Patient Portal",icon:"\u{1F3E5}",desc:"Patient self-service",color:"#1A7A50",link:"CareSync_Patient_Portal_Combined.html"},
  {id:"telehealth",name:"Telehealth",icon:"\u{1F4F9}",desc:"Video visits",color:"#1D4ED8"},
  {id:"erx",name:"e-Prescribe",icon:"\u{1F48A}",desc:"Rx + EPCS",color:"#7C3AED"},
  {id:"ai_agent",name:"AI Call Agent",icon:"\u{1F916}",desc:"Phone automation",color:"#2E7D32"},
  {id:"ai_emr",name:"AI-Assisted EMR",icon:"\uD83E\uDD16",desc:"AI Scribe · HCC · Coding · Quality",color:"#1a6eb5",link:"mof-ai-emr.html"},
  {id:"clinical_ai",name:"Clinical AI Suite",icon:"\u2695\uFE0F",desc:"AWV · Telehealth · TCM · BHI · APCM",color:"#5c35a8",link:"mof-clinical-ai.html"},
  {id:"voip",name:"VOIP System",icon:"\u260E\uFE0F",desc:"Phone lines",color:"#B45309"},
  {id:"mips",name:"MIPS / Quality",icon:"\u{1F4CA}",desc:"MACRA reporting",color:"#9A6B10"},
  {id:"audit",name:"Audit & Compliance",icon:"\u{1F512}",desc:"HIPAA, ONC",color:"#8A3B5E"},
  {id:"pop_health",name:"Population Health",icon:"\u{1F4C8}",desc:"Risk stratification",color:"#0E7C86",link:"CareSync_Population_Dashboard_3.html"},
  {id:"interop",name:"Interoperability",icon:"\u{1F310}",desc:"FHIR, HL7, HIE",color:"#374151"},
  {id:"admin",name:"System Admin",icon:"\u2699\uFE0F",desc:"Users, config",color:"#6B7280"},
  {id:"global_admin",name:"Global Command",icon:"\u{1F451}",desc:"Super Admin Center",color:"#9A6B10",link:"CareSync_SuperAdmin.html"}
];
var PERM_ACTIONS = ["view","create","edit","delete","sign","configure","export","admin"];
var ALL_MOD_IDS = ALL_MODULES.map(function(m){return m.id});
var allPerms = {};
ALL_MODULES.forEach(function(m){ allPerms[m.id] = PERM_ACTIONS.slice(); });
var regionModIds = ["ehr","scheduler","rcm","portal","telehealth","erx","ai_agent","voip","mips","audit","pop_health","interop","admin"];
var regionPerms = {};
regionModIds.forEach(function(m){ regionPerms[m] = ["view","create","edit","configure","export","admin"]; });

var ROLES = [
  {id:"global_super_admin",name:"Global Super Admin",tier:0,color:"#9A6B10",icon:"\u{1F451}",builtIn:true,modules:ALL_MOD_IDS,permissions:allPerms,mfaRequired:true,mfaMethod:"fido2",sessionMin:30,desc:"Unrestricted worldwide authority"},
  {id:"regional_admin",name:"Regional Super Admin",tier:1,color:"#0B6E99",icon:"\u{1F310}",builtIn:true,modules:regionModIds,permissions:regionPerms,mfaRequired:true,mfaMethod:"totp",sessionMin:30,desc:"Full authority within assigned region"},
  {id:"practice_admin",name:"Practice Admin",tier:3,color:"#B45309",icon:"\u{1F3E5}",builtIn:true,modules:["ehr","scheduler","rcm","portal","voip","ai_agent","admin"],permissions:{ehr:["view","configure"],scheduler:["view","create","edit","configure"],rcm:["view","configure"],portal:["view","configure"],voip:["view","configure"],ai_agent:["view","configure"],admin:["view","create","edit","configure"]},mfaRequired:true,mfaMethod:"totp",sessionMin:15,desc:"Single-practice authority"},
  {id:"physician",name:"Physician (MD/DO)",tier:4,color:"#0E7C86",icon:"\u{1FA7A}",builtIn:true,modules:["ehr","scheduler","telehealth","erx","mips"],permissions:{ehr:["view","create","edit","sign"],scheduler:["view","create"],telehealth:["view","create"],erx:["view","create","sign"],mips:["view"]},mfaRequired:true,mfaMethod:"totp",sessionMin:15,desc:"Full clinical chart access"},
  {id:"nurse",name:"RN / LPN",tier:5,color:"#1D4ED8",icon:"\u{1F489}",builtIn:true,modules:["ehr","scheduler"],permissions:{ehr:["view","create","edit"],scheduler:["view","create"]},mfaRequired:false,mfaMethod:"optional",sessionMin:15,desc:"Nursing documentation, vitals"},
  {id:"front_desk",name:"Front Office",tier:6,color:"#CA8A04",icon:"\u{1F4DE}",builtIn:true,modules:["scheduler","portal","voip"],permissions:{scheduler:["view","create","edit"],portal:["view","configure"],voip:["view","create"]},mfaRequired:false,mfaMethod:"optional",sessionMin:15,desc:"Scheduling, check-in/out"},
  {id:"billing",name:"Billing Specialist",tier:6,color:"#8A3B5E",icon:"\u{1F4B0}",builtIn:true,modules:["rcm","mips"],permissions:{rcm:["view","create","edit","export"],mips:["view"]},mfaRequired:true,mfaMethod:"totp",sessionMin:15,desc:"Claims, denial management"},
  {id:"patient",name:"Patient",tier:9,color:"#1A7A50",icon:"\u{1F60A}",builtIn:true,modules:["portal"],permissions:{portal:["view","create","edit"]},mfaRequired:false,mfaMethod:"optional",sessionMin:480,desc:"Self-service portal access"}
];

var DEMO_USERS = {
  "subodh@caresync.pro":{name:"Dr. Subodh Agrawal",role:"global_super_admin",region:"Global",avatar:"SA"},
  "amelia@caresync.pro":{name:"Dr. Amelia Chen",role:"regional_admin",region:"North America",avatar:"AC"},
  "sarah@athensheart.com":{name:"Sarah Mitchell",role:"practice_admin",region:"NA - Georgia",avatar:"SM"},
  "james@fullfamily.com":{name:"Dr. James Okonkwo",role:"physician",region:"NA - Georgia",avatar:"JO"},
  "priya@apollocare.in":{name:"Nurse Priya Nair",role:"nurse",region:"SA - India",avatar:"PN"},
  "rosa@caresync.mx":{name:"Rosa Mendez",role:"front_desk",region:"LA - Mexico",avatar:"RM"},
  "ahmed@caresync.ae":{name:"Ahmed Hassan",role:"billing",region:"ME - UAE",avatar:"AH"},
  "patient@gmail.com":{name:"Margaret Johnson",role:"patient",region:"NA - Georgia",avatar:"MJ"}
};

// ===== HELPERS =====
var h = React.createElement;
function findRole(roleId) {
  for (var i = 0; i < ROLES.length; i++) {
    if (ROLES[i].id === roleId) return ROLES[i];
  }
  return null;
}
function getModulesForRole(role) {
  if (!role) return [];
  return ALL_MODULES.filter(function(m) { return role.modules.indexOf(m.id) !== -1; });
}
function getDimModules(role) {
  if (!role) return ALL_MODULES.slice();
  return ALL_MODULES.filter(function(m) { return role.modules.indexOf(m.id) === -1; });
}
function permColor(p) {
  if (p === "admin") return {bg:"#FFF8E1",fg:"#9A6B10"};
  if (p === "sign") return {bg:"#E5F5ED",fg:"#1A7A50"};
  if (p === "delete") return {bg:"#FDECEA",fg:"#C0392B"};
  return {bg:"#E5F3FA",fg:"#0B6E99"};
}

// ===== APP =====
function App() {
  var useState = React.useState;
  var vs = useState("login"); var view = vs[0]; var setView = vs[1];
  var es = useState("subodh@caresync.pro"); var email = es[0]; var setEmail = es[1];
  var ps = useState(""); var pw = ps[0]; var setPw = ps[1];
  var sps = useState(false); var showPw = sps[0]; var setShowPw = sps[1];
  var sts = useState(true); var stayLogged = sts[0]; var setStayLogged = sts[1];
  var ms = useState(""); var mfaCode = ms[0]; var setMfaCode = ms[1];
  var ers = useState(""); var error = ers[0]; var setError = ers[1];
  var us = useState(null); var user = us[0]; var setUser = us[1];
  var ts = useState(""); var toast = ts[0]; var setToast = ts[1];
  var sms = useState(null); var selMod = sms[0]; var setSelMod = sms[1];

  function flash(msg) { setToast(msg); setTimeout(function(){ setToast(""); }, 3000); }

  function doLogin() {
    var u = DEMO_USERS[email];
    if (!u) { setError("Account not found. Tap a demo chip above."); return; }
    if (!pw) { setError("Enter your password (or tap a demo chip)."); return; }
    var role = findRole(u.role);
    var loggedUser = {name:u.name,role:u.role,region:u.region,avatar:u.avatar,email:email};
    setUser(loggedUser);
    if (role && role.mfaRequired) {
      setView("mfa");
    } else {
      setView("dashboard");
      flash("Welcome, " + u.name.split(" ")[0] + "!");
    }
  }

  function completeMfa() {
    if (mfaCode.length < 6) { setError("Enter all 6 digits"); return; }
    setView("dashboard");
    setMfaCode("");
    setError("");
    flash("Welcome, " + user.name.split(" ")[0] + "!");
  }

  function doSignout() {
    setView("login");
    setUser(null);
    setPw("");
    setMfaCode("");
    setError("");
    setSelMod(null);
  }

  // ===== TOAST =====
  var toastEl = toast ? h("div", {className:"toast"}, toast) : null;

  // ===== LOGIN VIEW =====
  if (view === "login") {
    var chips = Object.keys(DEMO_USERS).map(function(em) {
      var u = DEMO_USERS[em];
      var lastName = u.name.split(" ").slice(-1)[0];
      return h("button", {
        key: em,
        className: "demo-chip" + (email === em ? " active" : ""),
        onClick: function() { setEmail(em); setPw("Demo@2026!"); setError(""); }
      }, u.avatar + " " + lastName);
    });

    return h("div", null,
      h("div", {className:"login-wrap"},
        h("div", {className:"login-card"},
          h("div", {className:"login-header"},
            h("div", {className:"logo-mark"}, "CS"),
            h("div", {className:"login-title"}, "CareSync Pro"),
            h("div", {className:"login-sub"}, "Worldwide ONC-Certified EMR Platform")
          ),
          h("div", {className:"login-body"},
            h("div", {className:"demo-section"},
              h("div", {className:"demo-label"}, "DEMO - TAP ANY ROLE TO AUTO-FILL"),
              h("div", {className:"demo-chips"}, chips)
            ),
            h("label", {className:"form-label"}, "Email"),
            h("input", {className:"form-input", style:{marginBottom:14}, value:email, onChange:function(e){setEmail(e.target.value);setError("")}, placeholder:"you@clinic.com", autoComplete:"username"}),
            h("label", {className:"form-label"}, "Password"),
            h("div", {className:"pw-wrap"},
              h("input", {className:"form-input", type:showPw?"text":"password", value:pw, onChange:function(e){setPw(e.target.value);setError("")}, placeholder:"Enter password", autoComplete:"current-password"}),
              h("button", {className:"pw-toggle", onClick:function(){setShowPw(!showPw)}}, showPw ? "\u{1F648}" : "\u{1F441}\uFE0F")
            ),
            h("div", {className:"stay-row", onClick:function(){setStayLogged(!stayLogged)}},
              h("div", {className:"cbox" + (stayLogged ? " on" : "")}, stayLogged ? "\u2713" : ""),
              h("span", {style:{fontSize:13,color:"var(--txS)"}}, "Keep me signed in")
            ),
            error ? h("div", {className:"error-box"}, error) : null,
            h("button", {className:"btn-primary", onClick:doLogin}, "Sign In"),
            h("div", {className:"links-row"},
              h("button", {className:"link-btn", onClick:function(){flash("Password recovery coming soon")}}, "Forgot password?"),
              h("span", {style:{color:"var(--bdL)"}}, " | "),
              h("button", {className:"link-btn", onClick:function(){flash("Patient registration coming soon")}}, "New patient?")
            )
          ),
          h("div", {className:"login-footer"}, "\u{1F512} HIPAA \u00B7 TLS 1.3 \u00B7 ONC Certified \u00B7 \u00A9 2026 CareSync Pro")
        )
      ),
      toastEl
    );
  }

  // ===== MFA VIEW =====
  if (view === "mfa") {
    var role = findRole(user ? user.role : "");
    var method = role ? role.mfaMethod : "totp";
    var isFido = method === "fido2";

    return h("div", null,
      h("div", {className:"login-wrap"},
        h("div", {className:"login-card", style:{padding:32}},
          h("div", {style:{textAlign:"center",marginBottom:24}},
            h("div", {style:{fontSize:44,marginBottom:10}}, isFido ? "\u{1F510}" : "\u{1F4F1}"),
            h("div", {style:{fontSize:20,fontWeight:800}}, "Verify Your Identity"),
            h("div", {style:{fontSize:13,color:"var(--txS)",marginTop:4}}, isFido ? "Touch your hardware security key (FIDO2)" : "Enter the 6-digit code from your authenticator app")
          ),
          isFido
            ? h("button", {className:"btn-primary btn-gold", onClick:function(){setView("dashboard");flash("Welcome, "+user.name.split(" ")[0]+"!")}}, "\u{1F511} Simulate Key Tap")
            : h("div", null,
                h("input", {className:"form-input mfa-input", value:mfaCode, onChange:function(e){setMfaCode(e.target.value.replace(/\D/g,""))}, maxLength:6, placeholder:"000000", style:{marginBottom:14}}),
                h("button", {className:"btn-primary", onClick:completeMfa}, "Verify & Sign In")
              ),
          error ? h("div", {className:"error-box", style:{marginTop:14,textAlign:"center"}}, error) : null,
          h("div", {style:{textAlign:"center",marginTop:16}},
            h("button", {className:"link-btn", onClick:function(){setView("login");setMfaCode("");setError("")}}, "\u2190 Back to login")
          )
        )
      ),
      toastEl
    );
  }

  // ===== DASHBOARD VIEW =====
  if (view === "dashboard") {
    var role = findRole(user ? user.role : "");
    var myMods = getModulesForRole(role);
    var dimMods = getDimModules(role);
    var showRoleBuilder = role && role.tier <= 2;

    // Tiles for accessible modules
    var myTiles = myMods.map(function(m) {
      var perms = (role && role.permissions && role.permissions[m.id]) ? role.permissions[m.id] : [];
      var isSelected = selMod === m.id;
      return h("div", {
        key: m.id,
        className: "tile",
        style: {borderColor: isSelected ? m.color : ""},
        onClick: function() {
          if (m.link) { window.location.href = m.link; }
          else { setSelMod(isSelected ? null : m.id); }
        }
      },
        h("div", {className:"tile-top"},
          h("span", {className:"tile-icon"}, m.icon),
          h("div", null,
            h("div", {className:"tile-name"}, m.name),
            h("div", {className:"tile-desc"}, m.desc)
          )
        ),
        m.link ? h("div", {className:"tile-link", style:{color:m.color}}, "\u2192 OPEN MODULE") : null,
        isSelected ? h("div", {className:"tile-perms"},
          perms.map(function(p) {
            var c = permColor(p);
            return h("span", {key:p, className:"pbadge", style:{background:c.bg,color:c.fg}}, p);
          })
        ) : null
      );
    });

    // Dimmed tiles for inaccessible modules
    var dimTiles = dimMods.map(function(m) {
      return h("div", {key:m.id, className:"tile dim"},
        h("div", {className:"tile-top"},
          h("span", {className:"tile-icon"}, m.icon),
          h("div", null,
            h("div", {className:"tile-name"}, m.name),
            h("div", {className:"tile-desc"}, "No access")
          )
        )
      );
    });

    return h("div", {className:"dash"},
      h("div", {className:"topbar"},
        h("div", {className:"topbar-left"},
          h("div", {className:"topbar-mark"}, "CS"),
          h("div", null,
            h("div", {style:{fontSize:15,fontWeight:800}}, "CareSync Pro"),
            h("div", {style:{fontSize:10,color:"var(--txM)",fontFamily:"var(--fm)"}}, (user ? user.region : "") + " \u00B7 " + (role ? role.name : ""))
          )
        ),
        h("div", {className:"topbar-right"},
          showRoleBuilder ? h("button", {className:"btn-sm btn-rb", onClick:function(){setView("role_builder")}}, "\u2699\uFE0F Role Builder") : null,
          h("div", {className:"user-pill"},
            h("div", {className:"user-av", style:{background:(role?role.color:"#0B6E99")+"20",color:role?role.color:"#0B6E99"}}, user ? user.avatar : ""),
            h("div", null,
              h("div", {style:{fontSize:13,fontWeight:700}}, user ? user.name : ""),
              h("div", {style:{fontSize:10,color:"var(--txM)",fontFamily:"var(--fm)"}}, user ? user.email : "")
            )
          ),
          h("a", {href:"schedule.html", target:"_blank", className:"btn-sm", style:{background:"#1a6ef5",color:"#fff",border:"1.5px solid #1a6ef5",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:"4px"}}, "\uD83D\uDCC5 Schedule Engine"),
          h("a", {href:"mof-ai-emr.html", target:"_blank", className:"btn-sm", style:{background:"linear-gradient(135deg,#1a6eb5,#2563eb)",color:"#fff",border:"1.5px solid #2563eb",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:"4px",boxShadow:"0 2px 8px rgba(26,110,181,.3)"}}, "\uD83E\uDD16 AI EMR"),
          h("a", {href:"mof-clinical-ai.html", target:"_blank", className:"btn-sm", style:{background:"linear-gradient(135deg,#5c35a8,#7c3aed)",color:"#fff",border:"1.5px solid #7c3aed",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:"4px",boxShadow:"0 2px 8px rgba(92,53,168,.3)"}}, "\u2695\uFE0F Clinical AI"),
          h("button", {className:"btn-sm btn-so", onClick:doSignout}, "Sign Out")
        )
      ),
      h("div", {className:"dash-body"},
        h("div", {className:"dash-inner"},
          h("div", {className:"welcome"},
            h("h1", null, "Welcome, " + (user ? user.name.split(" ")[0] : "") + " \u{1F44B}"),
            h("p", null,
              "Your role: ",
              h("span", {style:{fontWeight:700,color:role?role.color:"#000"}}, (role?role.icon:"") + " " + (role?role.name:"")),
              " \u2014 " + myMods.length + " module" + (myMods.length !== 1 ? "s" : "") + " available"
            )
          ),
          h("div", {className:"tile-grid"}, myTiles),
          dimMods.length > 0 ? h("div", null,
            h("div", {className:"section-label"}, "NOT AVAILABLE FOR YOUR ROLE"),
            h("div", {className:"tile-grid"}, dimTiles)
          ) : null
        )
      ),
      toastEl
    );
  }

  // ===== ROLE BUILDER VIEW =====
  if (view === "role_builder") {
    var roleCards = ROLES.map(function(r) {
      return h("div", {key:r.id, className:"rb-card"},
        h("div", {className:"rb-icon", style:{background:(r.color||"#0B6E99")+"18"}}, r.icon),
        h("div", {style:{flex:1}},
          h("div", {className:"rb-name"},
            r.name, " ",
            h("span", {className:"tier-badge", style:{background:(r.color||"#0B6E99")+"15",color:r.color||"#0B6E99"}}, "TIER " + r.tier),
            r.builtIn ? h("span", {className:"builtin-tag"}, "BUILT-IN") : null
          ),
          h("div", {className:"rb-desc"}, r.desc)
        ),
        h("div", {className:"rb-meta"},
          h("div", {style:{fontSize:12,fontWeight:700,color:"var(--pri)"}}, r.modules.length + " modules"),
          h("div", {style:{fontSize:11,color:"var(--txM)",fontFamily:"var(--fm)"}}, r.mfaRequired ? "MFA required" : "MFA optional")
        )
      );
    });

    return h("div", {className:"dash"},
      h("div", {className:"topbar"},
        h("div", {style:{display:"flex",alignItems:"center",gap:10}},
          h("button", {className:"btn-sm btn-so", onClick:function(){setView("dashboard")}}, "\u2190 Dashboard"),
          h("div", {style:{fontSize:16,fontWeight:800}}, "\u2699\uFE0F Dynamic Role & Permission Builder")
        ),
        h("button", {className:"btn-sm", style:{border:"none",background:"linear-gradient(135deg,#1A7A50,#25A76B)",color:"#fff"}}, "+ New Role")
      ),
      h("div", {className:"dash-body"},
        h("div", {className:"dash-inner"},
          h("div", {className:"section-label"}, ROLES.length + " ROLES DEFINED"),
          roleCards,
          h("div", {className:"hint-box"},
            h("div", {style:{fontSize:13,fontWeight:700,color:"var(--pri)",marginBottom:6}}, "\u{1F4A1} How Dynamic Roles Work"),
            h("div", {style:{fontSize:12,color:"var(--txS)",lineHeight:1.7}}, "When new tech is added (Genomics, AI Scribe, etc.), add it as a module and assign permissions to roles. No code changes needed \u2014 roles are database-driven.")
          )
        )
      ),
      toastEl
    );
  }

  return h("div", {className:"login-wrap"}, h("div", null, "Loading..."));
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
</body>
</html>
