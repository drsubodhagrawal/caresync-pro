<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CareSync Pro — Global Super Admin Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F3F5F9;--card:#FFF;--card2:#F7F9FC;--pri:#0A5E8C;--priL:#E3F1FA;--priG:linear-gradient(135deg,#0A5E8C,#0D7AB5);--acc:#1B7A4E;--accL:#E4F5ED;--accG:linear-gradient(135deg,#1B7A4E,#27A96A);--gold:#9E6C13;--goldL:#FFF8E1;--goldG:linear-gradient(135deg,#9E6C13,#D4941A);--sec:#8B3A5E;--secL:#FAE9F1;--pu:#5A3D8A;--puL:#F0EAFA;--red:#C0392B;--redL:#FDECEA;--green:#1B7A4E;--greenL:#E4F5ED;--amber:#B77D14;--amberL:#FFF3CD;--tx:#111827;--txS:#4B5563;--txM:#9CA3AF;--bd:#E5E7EB;--bdL:#F3F4F6;--fn:'DM Sans',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;--sh:0 1px 8px rgba(0,0,0,.06);--shM:0 4px 16px rgba(0,0,0,.08)}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);overflow:hidden;height:100vh;display:flex}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 8px rgba(0,0,0,.04)}
.sb-logo{padding:18px 20px;border-bottom:1px solid var(--bdL);display:flex;align-items:center;gap:10px}
.sb-mark{width:36px;height:36px;border-radius:10px;background:var(--priG);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;font-family:var(--fm)}
.sb-name{font-size:15px;font-weight:900}
.sb-sub{font-size:9px;font-weight:700;color:var(--txM);font-family:var(--fm);letter-spacing:.08em}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;margin-bottom:3px;cursor:pointer;font-size:13px;font-weight:600;color:var(--txS);transition:all .15s}
.sb-item:hover{background:var(--bdL)}
.sb-item.active{background:var(--priL);color:var(--pri);font-weight:800}
.sb-item span{font-size:18px}
.sb-back{padding:12px 8px;border-top:1px solid var(--bdL)}
.sb-back a{display:block;text-align:center;padding:8px;border-radius:8px;background:var(--card2);color:var(--txS);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--bd)}
.sb-back a:hover{background:var(--priL);color:var(--pri)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0}
.tb-left{font-size:16px;font-weight:800}
.tb-right{display:flex;align-items:center;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;font-family:var(--fm);letter-spacing:.06em}
.user-av{width:34px;height:34px;border-radius:10px;background:var(--goldG);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;font-family:var(--fm)}
.content{flex:1;overflow-y:auto;padding:28px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-bg{position:absolute;top:-8px;right:-4px;font-size:48px;opacity:.06}
.stat-label{font-size:11px;font-weight:700;color:var(--txM);font-family:var(--fm);letter-spacing:.08em;margin-bottom:8px}
.stat-val{font-size:28px;font-weight:900;line-height:1}
.stat-sub{font-size:12px;color:var(--txS);margin-top:6px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:var(--sh);margin-bottom:24px}
.panel-title{font-size:12px;font-weight:800;color:var(--txM);font-family:var(--fm);letter-spacing:.08em;margin-bottom:16px}
.region-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.region{background:var(--card2);border:1px solid var(--bdL);border-radius:12px;padding:18px 20px}
.region-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.region-name{display:flex;align-items:center;gap:8px}
.region-name span{font-size:24px}
.region-title{font-size:14px;font-weight:800}
.region-lead{font-size:11px;color:var(--txM);font-family:var(--fm)}
.region-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rs-val{font-size:16px;font-weight:900;color:var(--pri);text-align:center}
.rs-label{font-size:9px;font-weight:700;color:var(--txM);font-family:var(--fm);letter-spacing:.05em;text-align:center}
.audit-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdL)}
.audit-row:last-child{border:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.audit-ts{min-width:140px;font-size:11px;color:var(--txM);font-family:var(--fm);flex-shrink:0}
.audit-user{min-width:160px;font-size:12px;color:var(--txS);font-weight:600;flex-shrink:0}
.audit-detail{flex:1;font-size:13px}
.sec-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:20px}
.sec-title span{font-size:22px}
.sec-sub{font-size:13px;color:var(--txS);margin-top:4px;margin-left:36px;margin-bottom:20px}
.role-card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer;transition:all .2s}
.role-card:hover{border-color:var(--pri)}
.role-head{display:flex;align-items:center;gap:16px;padding:18px 24px}
.role-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.role-meta{flex:1}
.role-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.role-desc{font-size:12px;color:var(--txS);margin-top:3px}
.role-count{text-align:right;min-width:80px}
.role-num{font-size:20px;font-weight:900}
.role-detail{border-top:1px solid var(--bdL);padding:20px 24px;background:var(--card2);border-radius:0 0 12px 12px}
.perm-list{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.perm-dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.perm-text{font-size:12px}
.sec-req{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;font-size:12px;line-height:1.7}
.anti-esc{font-size:12px;color:var(--sec);font-weight:700;background:var(--secL);padding:8px 12px;border-radius:8px;margin-top:14px}
.policy-table{width:100%;border-collapse:collapse}
.policy-table th{text-align:left;padding:12px 18px;font-size:9px;font-weight:900;color:var(--txM);font-family:var(--fm);letter-spacing:.08em;border-bottom:1px solid var(--bd);background:var(--card2)}
.policy-table td{padding:14px 18px;border-bottom:1px solid var(--bdL);font-size:13px}
.compliance-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.comp-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:var(--sh)}
.comp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.comp-flag{font-size:24px;margin-right:10px}
.comp-name{font-size:15px;font-weight:800}
.comp-std{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState}=React;
const REGIONS=[{id:"na",name:"North America",emoji:"\u{1F30E}",countries:3,practices:1247,users:18420,status:"active",lead:"Dr. Amelia Chen"},{id:"eu",name:"Europe (GDPR)",emoji:"\u{1F30D}",countries:12,practices:843,users:11360,status:"active",lead:"Dr. Lars Eriksson"},{id:"me",name:"Middle East & Africa",emoji:"\u{1F30D}",countries:8,practices:312,users:4180,status:"active",lead:"Dr. Fatima Al-Rashid"},{id:"ap",name:"Asia-Pacific",emoji:"\u{1F30F}",countries:9,practices:621,users:8740,status:"active",lead:"Dr. Kenji Tanaka"},{id:"la",name:"Latin America",emoji:"\u{1F30E}",countries:6,practices:198,users:2840,status:"expanding",lead:"Dr. Isabella Reyes"},{id:"sa",name:"South Asia",emoji:"\u{1F30F}",countries:4,practices:445,users:6210,status:"active",lead:"Dr. Priya Sharma"}];
const ROLES=[{tier:0,id:"gsa",label:"Global Super Admin",icon:"\u{1F451}",count:3,color:"var(--gold)",perms:["Create/revoke Super Admins","Global policy enforcement","AI/ML model governance","License management","Emergency lockdown"],security:"FIDO2 hardware key + biometric. IP whitelist. 30 min session."},{tier:1,id:"rsa",label:"Regional Super Admin",icon:"\u{1F310}",count:6,color:"var(--pri)",perms:["Create Country Admins","Regional compliance (GDPR/HIPAA)","Data residency management","Regional AI model tuning"],security:"TOTP authenticator + password. Regional IP range. 30 min session."},{tier:2,id:"ca",label:"Country Admin",icon:"\u{1F3DB}\uFE0F",count:42,color:"var(--acc)",perms:["Create Practice Admins","National compliance config","Payer/insurer integration","Billing code localization"],security:"TOTP + password. Country IP range. 30 min session."},{tier:3,id:"qco",label:"Quality & Compliance",icon:"\u{1F512}",count:28,color:"var(--pu)",perms:["HIPAA/GDPR audit access","MIPS/MACRA reporting","Privacy incident management","Cross-practice read access"],security:"TOTP + password. Read-only clinical. Full audit trail."},{tier:3,id:"pa",label:"Practice Admin",icon:"\u{1F3E5}",count:3666,color:"#B45309",perms:["Create staff accounts","Module access assignment","Practice settings","Local workflow config"],security:"TOTP or SMS MFA + password. Practice-scoped access."},{tier:4,id:"md",label:"Physician (MD/DO)",icon:"\u{1FA7A}",count:8240,color:"#0E7C86",perms:["Patient chart full access","Order entry","e-Prescribe + EPCS","Clinical note sign-off","Co-sign NP/PA notes"],security:"TOTP MFA + password. DEA verification for EPCS. 15 min lock."},{tier:5,id:"rn",label:"RN / LPN",icon:"\u{1F489}",count:12480,color:"#1D4ED8",perms:["Vitals entry","Nursing notes","Medication admin","Triage documentation"],security:"Password + optional MFA. Role-restricted chart sections."},{tier:6,id:"fd",label:"Front Office",icon:"\u{1F4DE}",count:7320,color:"#CA8A04",perms:["Scheduling","Patient check-in/out","Demographics","Insurance verification"],security:"Password required. No clinical data access."},{tier:6,id:"bl",label:"Billing / RCM",icon:"\u{1F4B0}",count:3420,color:"var(--sec)",perms:["Claim submission (837P)","ERA/EOB posting","Denial management","AR follow-up"],security:"Password + MFA. Financial data access logged."}];
const AUDIT=[{ts:"2026-05-20 09:14",user:"Dr. Subodh Agrawal",action:"CREATE_ADMIN",detail:"Created Regional Super Admin for Latin America",sev:"high"},{ts:"2026-05-20 08:55",user:"Dr. Amelia Chen",action:"MODIFY_ROLE",detail:"Updated Country Admin permissions \u2014 added MIPS",sev:"medium"},{ts:"2026-05-20 07:30",user:"Michael Torres",action:"SUSPEND_USER",detail:"Suspended Practice Admin \u2014 compliance violation",sev:"high"},{ts:"2026-05-19 22:18",user:"SYSTEM",action:"THREAT_BLOCKED",detail:"Brute force blocked: 47 failed logins from Tor exit node",sev:"critical"},{ts:"2026-05-19 19:22",user:"Dr. Fatima Al-Rashid",action:"DATA_RESIDENCY",detail:"Configured UAE data residency \u2014 AWS me-south-1",sev:"high"}];
const POLICIES=[{name:"Password Min Length",value:"14 characters",standard:"NIST SP 800-63B"},{name:"MFA Requirement",value:"Required Tier 0-4; optional 5-7",standard:"ONC \u00A7170.315(d)(13)"},{name:"Session Timeout (Staff)",value:"15 min inactivity",standard:"HIPAA \u00A7164.312(a)(2)(iii)"},{name:"Failed Login Lockout",value:"5 attempts \u2192 30 min lock",standard:"NIST SP 800-53 AC-7"},{name:"Password History",value:"Last 12 blocked",standard:"CIS Benchmark"},{name:"Encryption at Rest",value:"AES-256-GCM",standard:"HIPAA \u00A7164.312(a)(2)(iv)"},{name:"Encryption in Transit",value:"TLS 1.3 minimum",standard:"HIPAA \u00A7164.312(e)(1)"},{name:"Audit Log Retention",value:"6 years, append-only",standard:"HIPAA \u00A7164.312(b)"},{name:"Biometric Auth (Tier 0)",value:"FIDO2 WebAuthn",standard:"NIST SP 800-63B AAL3"}];
const COMPLIANCE=[{region:"United States",flags:"\u{1F1FA}\u{1F1F8}",standards:["HIPAA Security Rule","HITECH Act","ONC HTI-1 / HTI-2","42 CFR Part 2","NIST CSF 2.0"],status:"compliant"},{region:"European Union",flags:"\u{1F1EA}\u{1F1FA}",standards:["GDPR (Art. 1-99)","EU MDR 2017/745","NIS2 Directive","EU AI Act"],status:"compliant"},{region:"Middle East",flags:"\u{1F1E6}\u{1F1EA}\u{1F1F8}\u{1F1E6}",standards:["DHA NABIDH","NPHIES (Saudi)","PDPL (Saudi)","UAE Federal Data Law"],status:"in_progress"},{region:"India",flags:"\u{1F1EE}\u{1F1F3}",standards:["DPDP Act 2023","ABDM Standards","NDHM Health ID"],status:"in_progress"},{region:"Asia-Pacific",flags:"\u{1F1EF}\u{1F1F5}\u{1F1F0}\u{1F1F7}\u{1F1F8}\u{1F1EC}",standards:["APPI (Japan)","PIPA (South Korea)","PDPA (Singapore)"],status:"partial"},{region:"Latin America",flags:"\u{1F1E7}\u{1F1F7}\u{1F1F2}\u{1F1FD}",standards:["LGPD (Brazil)","Ley Federal de Datos (Mexico)"],status:"partial"}];

function App(){
  const [nav,setNav]=useState("overview");
  const [openRole,setOpenRole]=useState(null);
  const totalU=REGIONS.reduce((s,r)=>s+r.users,0);const totalP=REGIONS.reduce((s,r)=>s+r.practices,0);const totalC=REGIONS.reduce((s,r)=>s+r.countries,0);
  const sevColor=(s)=>s==="critical"?"var(--red)":s==="high"?"var(--amber)":s==="medium"?"var(--pri)":"var(--txM)";

  const Overview=()=><div><div className="sec-title"><span>\u{1F30D}</span>Global Platform Overview</div><div className="sec-sub">CareSync Pro \u2014 Worldwide EMR Command Center</div><div className="stat-grid"><div className="stat"><div className="stat-bg">\u{1F30E}</div><div className="stat-label">REGIONS</div><div className="stat-val" style={{color:"var(--pri)"}}>{REGIONS.length}</div><div className="stat-sub">Active worldwide</div></div><div className="stat"><div className="stat-bg">\u{1F3F3}\uFE0F</div><div className="stat-label">COUNTRIES</div><div className="stat-val" style={{color:"var(--acc)"}}>{totalC}</div><div className="stat-sub">National deployments</div></div><div className="stat"><div className="stat-bg">\u{1F3E5}</div><div className="stat-label">PRACTICES</div><div className="stat-val" style={{color:"var(--gold)"}}>{totalP.toLocaleString()}</div><div className="stat-sub">Active facilities</div></div><div className="stat"><div className="stat-bg">\u{1F464}</div><div className="stat-label">USERS</div><div className="stat-val" style={{color:"var(--pu)"}}>{totalU.toLocaleString()}</div><div className="stat-sub">All roles</div></div></div><div className="panel"><div className="panel-title">REGIONAL DEPLOYMENTS</div><div className="region-grid">{REGIONS.map(r=><div key={r.id} className="region"><div className="region-head"><div className="region-name"><span>{r.emoji}</span><div><div className="region-title">{r.name}</div><div className="region-lead">{r.lead}</div></div></div><span className="badge" style={{background:r.status==="active"?"var(--greenL)":"var(--amberL)",color:r.status==="active"?"var(--green)":"var(--amber)"}}>{r.status.toUpperCase()}</span></div><div className="region-stats"><div><div className="rs-val">{r.countries}</div><div className="rs-label">COUNTRIES</div></div><div><div className="rs-val">{r.practices.toLocaleString()}</div><div className="rs-label">PRACTICES</div></div><div><div className="rs-val">{r.users.toLocaleString()}</div><div className="rs-label">USERS</div></div></div></div>)}</div></div><div className="panel"><div className="panel-title">LIVE AUDIT FEED</div>{AUDIT.map((a,i)=><div key={i} className="audit-row"><div className="dot" style={{background:sevColor(a.sev)}}/><div className="audit-ts">{a.ts}</div><div className="audit-user">{a.user}</div><span className="badge" style={{background:sevColor(a.sev)+"18",color:sevColor(a.sev),marginRight:8}}>{a.action.replace(/_/g," ")}</span><div className="audit-detail">{a.detail}</div></div>)}</div></div>;

  const RolesView=()=><div><div className="sec-title"><span>\u{1F3D7}\uFE0F</span>Global Role Hierarchy (RBAC)</div><div className="sec-sub">8-tier permission model \u2014 ONC \u00A7170.315(d)(1) compliant</div>{ROLES.map(r=>{const isOpen=openRole===r.id;return(<div key={r.id} className="role-card" style={{borderColor:isOpen?r.color+"55":"var(--bd)"}} onClick={()=>setOpenRole(isOpen?null:r.id)}><div className="role-head"><div className="role-icon" style={{background:r.color+"18"}}>{r.icon}</div><div className="role-meta"><div className="role-name">{r.label} <span className="badge" style={{background:r.color+"15",color:r.color}}>TIER {r.tier}</span></div><div className="role-desc">{r.perms.slice(0,3).join(" \u00B7 ")}</div></div><div className="role-count"><div className="role-num" style={{color:r.color}}>{r.count.toLocaleString()}</div><div style={{fontSize:9,fontWeight:700,color:"var(--txM)",fontFamily:"var(--fm)"}}>USERS</div></div><div style={{fontSize:18,color:"var(--txM)",transform:isOpen?"rotate(90deg)":"rotate(0)",transition:"transform .2s"}}>\u25B6</div></div>{isOpen&&<div className="role-detail" onClick={e=>e.stopPropagation()}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}><div><div style={{fontSize:10,fontWeight:800,color:"var(--txM)",fontFamily:"var(--fm)",letterSpacing:".08em",marginBottom:10}}>PERMISSIONS</div>{r.perms.map((p,i)=><div key={i} className="perm-list"><div className="perm-dot" style={{background:r.color}}/><div className="perm-text">{p}</div></div>)}</div><div><div style={{fontSize:10,fontWeight:800,color:"var(--txM)",fontFamily:"var(--fm)",letterSpacing:".08em",marginBottom:10}}>SECURITY</div><div className="sec-req">{r.security}</div><div className="anti-esc">\u26A0\uFE0F Can only delegate permissions they possess. Cannot create users at own tier or above.</div></div></div></div>}</div>)})}</div>;

  const SecurityView=()=><div><div className="sec-title"><span>\u{1F6E1}\uFE0F</span>Security & Authentication Policies</div><div className="sec-sub">ONC \u00A7170.315(d) \u00B7 NIST SP 800-63B \u00B7 HIPAA Security Rule</div><div className="panel" style={{overflow:"hidden",padding:0}}><table className="policy-table"><thead><tr><th>POLICY</th><th>VALUE</th><th>STANDARD</th><th>STATUS</th></tr></thead><tbody>{POLICIES.map((p,i)=><tr key={i}><td style={{fontWeight:700}}>{p.name}</td><td style={{fontFamily:"var(--fm)",fontSize:12,color:"var(--txS)"}}>{p.value}</td><td><span className="badge" style={{background:"var(--priL)",color:"var(--pri)"}}>{p.standard}</span></td><td><span className="badge" style={{background:"var(--greenL)",color:"var(--green)"}}>ENFORCED</span></td></tr>)}</tbody></table></div></div>;

  const ComplianceView=()=><div><div className="sec-title"><span>\u2696\uFE0F</span>Regional Compliance Framework</div><div className="sec-sub">Data sovereignty, privacy law compliance per region</div><div className="compliance-grid">{COMPLIANCE.map((c,i)=><div key={i} className="comp-card"><div className="comp-head"><div style={{display:"flex",alignItems:"center",gap:10}}><span className="comp-flag">{c.flags}</span><span className="comp-name">{c.region}</span></div><span className="badge" style={{background:c.status==="compliant"?"var(--greenL)":c.status==="in_progress"?"var(--amberL)":"var(--goldL)",color:c.status==="compliant"?"var(--green)":c.status==="in_progress"?"var(--amber)":"var(--gold)"}}>{c.status==="compliant"?"COMPLIANT":c.status==="in_progress"?"IN PROGRESS":"PARTIAL"}</span></div>{c.standards.map((s,j)=><div key={j} className="comp-std"><span style={{color:c.status==="compliant"?"var(--green)":"var(--amber)"}}>{c.status==="compliant"?"\u2713":"\u25CB"}</span>{s}</div>)}</div>)}</div></div>;

  const NAVS=[{id:"overview",label:"Global Overview",icon:"\u{1F30D}"},{id:"roles",label:"Role Hierarchy",icon:"\u{1F3D7}\uFE0F"},{id:"security",label:"Security Policies",icon:"\u{1F6E1}\uFE0F"},{id:"compliance",label:"Compliance",icon:"\u2696\uFE0F"}];
  const views={overview:Overview,roles:RolesView,security:SecurityView,compliance:ComplianceView};const V=views[nav]||Overview;

  return(<div style={{display:"flex",height:"100vh",overflow:"hidden"}}><div className="sidebar"><div className="sb-logo"><div className="sb-mark">CS</div><div><div className="sb-name">CareSync Pro</div><div className="sb-sub">GLOBAL SUPER ADMIN</div></div></div><div className="sb-nav">{NAVS.map(n=><div key={n.id} className={`sb-item${nav===n.id?" active":""}`} onClick={()=>setNav(n.id)}><span>{n.icon}</span>{n.label}</div>)}</div><div className="sb-back"><a href="index.html">\u2190 Back to Dashboard</a></div></div><div className="main"><div className="topbar"><div className="tb-left">{NAVS.find(n=>n.id===nav)?.label}</div><div className="tb-right"><span className="badge" style={{background:"var(--greenL)",color:"var(--green)"}}>ONC CERTIFIED</span><span className="badge" style={{background:"var(--goldL)",color:"var(--gold)"}}>\u{1F451} TIER 0</span><div style={{display:"flex",alignItems:"center",gap:8}}><div className="user-av">SA</div><div><div style={{fontSize:13,fontWeight:700}}>Dr. Subodh Agrawal</div><div style={{fontSize:10,color:"var(--txM)",fontFamily:"var(--fm)"}}>Global Super Admin</div></div></div></div></div><div className="content"><V/></div></div></div>);
